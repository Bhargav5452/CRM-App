<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lead CRM</title>
    <script>
      (function() {
        window.__STARTUP_LOGS__ = [];
        const startTime = performance.now();
        window.__mark = function(name, extra) {
          const t = Math.round(performance.now() - startTime);
          const entry = { name: name, time: t, extra: extra || '' };
          window.__STARTUP_LOGS__.push(entry);
          performance.mark(name);
          console.log(`[PERF_TIMELINE] ${String(t).padStart(5, ' ')}ms | ${name} ${extra || ''}`);
        };
        window.__mark('app_launched');
        document.addEventListener('DOMContentLoaded', function() {
          window.__mark('dom_content_loaded');
        });
        window.addEventListener('load', function() {
          window.__mark('window_loaded');
        });
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function() {
            window.__mark('fonts_loaded');
          });
        }
      })();
    </script>
    
    <base href="/" />
    
    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <link rel="manifest" href="/manifest.json" />
    
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lead CRM" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
