<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lead CRM</title>
    <!-- Safari 9 / iOS 9 redirect — runs before any framework code -->
    <script>
      (function(){
        var ua = navigator.userAgent || '';
        // Safari 9: "Version/9.x Safari" but NOT Chrome/Firefox pretending to be Safari
        var isSafari9 = /Version\/9\.\d+.*Safari/i.test(ua) && !/Chrome|CriOS|FxiOS/i.test(ua);
        // iOS 9 WebKit: "OS 9_" in UA (covers all iOS 9.x browsers)
        var isIOS9 = /OS 9_\d/i.test(ua);
        if ((isSafari9 || isIOS9) && location.pathname.indexOf('/legacy') !== 0) {
          location.replace('/legacy/');
        }
      })();
    </script>
    
    <base href="/" />
    
    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <link rel="manifest" href="/manifest.json" />
    
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lead CRM" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
