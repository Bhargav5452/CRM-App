    <meta name="format-detection" content="telephone=no" />

    <meta name="apple-mobile-web-app-title" content="Lead CRM" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        if (!window.location.origin) {
          window.location.origin = window.location.protocol + '//' + window.location.hostname + (window.location.port ? ':' + window.location.port : '');
        }

        if (typeof window.CustomEvent !== "function") {
          function CustomEvent(event, params) {
            params = params || { bubbles: false, cancelable: false, detail: null };
            var evt = document.createEvent('CustomEvent');
            evt.initCustomEvent(event, params.bubbles, params.cancelable, params.detail);
            return evt;
          }
          window.CustomEvent = CustomEvent;
        }

        // Safari 9 TypedArray & ArrayBuffer .slice() Polyfill
        var typedConstructors = [
          typeof Uint8Array !== 'undefined' ? Uint8Array : null,
          typeof Uint8ClampedArray !== 'undefined' ? Uint8ClampedArray : null,
          typeof Int8Array !== 'undefined' ? Int8Array : null,
          typeof Uint16Array !== 'undefined' ? Uint16Array : null,
          typeof Int16Array !== 'undefined' ? Int16Array : null,
          typeof Uint32Array !== 'undefined' ? Uint32Array : null,
          typeof Int32Array !== 'undefined' ? Int32Array : null,
          typeof Float32Array !== 'undefined' ? Float32Array : null,
          typeof Float64Array !== 'undefined' ? Float64Array : null
        ];

        for (var i = 0; i < typedConstructors.length; i++) {
          var ctor = typedConstructors[i];
          if (ctor && !ctor.prototype.slice) {
            ctor.prototype.slice = function(start, end) {
              return new this.constructor(this.subarray(start, end));
            };
          }
        }

        if (typeof ArrayBuffer !== 'undefined' && !ArrayBuffer.prototype.slice) {
          ArrayBuffer.prototype.slice = function(start, end) {
            var src = new Uint8Array(this).subarray(start, end);
            var dst = new Uint8Array(src.byteLength);
            dst.set(src);
            return dst.buffer;
          };
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
